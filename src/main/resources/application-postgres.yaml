spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wedding}
    username: ${DB_USERNAME:wedding}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Development database only: V900 adds clearly marked synthetic venues.
    locations: classpath:db/migration,classpath:db/demo
