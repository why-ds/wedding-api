spring:
  application:
    name: wedding-pai
  profiles:
    default: demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 512KB
      file-size-threshold: 0
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
wedding:
  # Origin used in emailed links. Never derived from the request Host header.
  public-base-url: ${WEDDING_PUBLIC_BASE_URL:http://127.0.0.1:5173}
  mail:
    # log: nothing is delivered (demo prints the message). ses: Amazon SES through the default AWS credential chain.
    provider: ${WEDDING_MAIL_PROVIDER:log}
    from: ${WEDDING_MAIL_FROM:}
    ses-region: ${WEDDING_MAIL_SES_REGION:ap-northeast-2}
