# Temporary preview, reachable through SSH only until a separate HTTPS site is configured.
server {
    listen 127.0.0.1:8088;
    server_name _;
    root /var/www/wedding-web/current;
    index index.html;
    client_max_body_size 512k;
    # Same CSP as the HTTPS site (minus upgrade-insecure-requests, which would break this HTTP tunnel)
    # so a policy violation shows up here before the domain goes live.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location ~ /\. {
        deny all;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
