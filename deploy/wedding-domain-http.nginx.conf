# DNS/ACME preparation only. No passwords or application sessions over public HTTP.
server {
    listen 80;
    server_name allaboutwedding.co.kr;
    charset utf-8;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wedding-acme;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "All About Wedding: HTTPS setup in progress.\n";
    }
}
