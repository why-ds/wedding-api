# Activate only after the certificate for this exact domain has been issued.
server {
    listen 80;
    server_name allaboutwedding.co.kr www.allaboutwedding.co.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wedding-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://allaboutwedding.co.kr$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name www.allaboutwedding.co.kr;
    ssl_certificate /etc/letsencrypt/live/allaboutwedding.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allaboutwedding.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://allaboutwedding.co.kr$request_uri;
}
server {
    listen 443 ssl;
    server_name allaboutwedding.co.kr;
    ssl_certificate /etc/letsencrypt/live/allaboutwedding.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allaboutwedding.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WeddingTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/wedding-web/current;
    index index.html;
    client_max_body_size 512k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location ~ /\. {
        deny all;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host allaboutwedding.co.kr;
        proxy_set_header X-Forwarded-Host allaboutwedding.co.kr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
